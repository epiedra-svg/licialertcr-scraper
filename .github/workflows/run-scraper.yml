name: Run SICOP Scraper

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Playwright (library)
        run: npm install playwright nodemailer

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Run scraper
        env:
          EMAIL_USER: ${{ epiedra@hidroambientecr.com }}
          EMAIL_PASS: ${{ dmgg xues wmey ilok }}
          EMAIL_TO: ${{ tramites@hidroambientecr.com }}
        run: node scraper.js
